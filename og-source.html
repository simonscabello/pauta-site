<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- Fonte da imagem de compartilhamento (assets/img/og.png, 1200x630). Não vai para o ar: o Dockerfile não a copia. Para regerar, veja a seção Site de apresentação do AGENTS.md. -->
<link rel="stylesheet" href="assets/styles.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#FBF8F2;color:#1B1830}
.og{width:1200px;height:630px;box-sizing:border-box;padding:70px 84px;position:relative}
.og .b{display:flex;align-items:center;gap:14px;font-family:var(--serif);font-size:40px;font-weight:600}
.og .b img{width:60px;height:60px;border-radius:15px}
.og h1{font-family:var(--serif);font-weight:400;font-size:112px;line-height:.98;letter-spacing:-.015em;margin:44px 0 30px}
.og h1 em{color:#4F46E5}
.og p{font-size:30px;color:#5E5876;margin:0}
.og .staff{position:absolute;left:0;right:0;bottom:30px;height:82px;max-width:none;
background:repeating-linear-gradient(180deg,rgba(27,24,48,.16) 0 2px,transparent 2px 20px) 0 0/100% 82px no-repeat}
.og .dot{position:absolute;right:120px;bottom:50px;width:30px;height:22px;border-radius:50%;background:#4F46E5;transform:rotate(-22deg)}
.og .dot::after{content:"";position:absolute;right:-2px;bottom:8px;width:3px;height:66px;background:#4F46E5;transform:rotate(22deg);transform-origin:bottom}
</style></head><body><div class="og"><div class="staff"></div><div class="dot"></div>
<div class="b"><img src="assets/img/icon-180.png" alt="">Pauta</div>
<h1>Domingo, 9h.<br><em>Você, no baixo.</em></h1>
<p>A escala, o ensaio e as músicas com tom e cifra, no celular de cada um.</p>
</div></body></html>
